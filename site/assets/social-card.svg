<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t"><title id="t">ArxivChecker. Every claim needs a way back. Trace, rebuild and review a study-to-paper package.</title><rect width="1200" height="630" fill="#f1f5f8"/><text x="75" y="88" fill="#132d43" font-family="Arial,sans-serif" font-size="25" font-weight="700">ArxivChecker</text><text x="75" y="246" fill="#132d43" font-family="Georgia,serif" font-size="69"><tspan x="75">Every claim needs</tspan><tspan x="75" dy="79">a way back.</tspan></text><text x="78" y="435" fill="#4b6172" font-family="Arial,sans-serif" font-size="26"><tspan x="78">Turn a finished study into a paper</tspan><tspan x="78" dy="39">you can trace, rebuild and review.</tspan></text><g transform="translate(845 115) rotate(4)"><rect x="5" y="7" width="260" height="360" fill="#dbe5ed"/><rect width="260" height="360" fill="white" stroke="#c6d3de"/><text x="28" y="59" fill="#132d43" font-family="Georgia,serif" font-size="28">Claim</text><path d="M30 73h113" stroke="#a53839" stroke-width="3"/><path d="M32 110h185M32 124h185M32 138h122" stroke="#dbe5ed" stroke-width="5"/><text x="30" y="200" fill="#175f66" font-family="Arial,sans-serif" font-size="19">Metric + denominator</text><path d="M130 217v33m-7-8 7 8 7-8" fill="none" stroke="#175f66" stroke-width="2"/><text x="30" y="285" fill="#175f66" font-family="Arial,sans-serif" font-size="19">Source + command</text><path d="m180 320 11 11 28-32" fill="none" stroke="#a53839" stroke-width="5" stroke-linecap="round"/></g><text x="78" y="575" fill="#4b6172" font-family="Arial,sans-serif" font-size="18">An independent Amplifier-compatible capability</text></svg>
